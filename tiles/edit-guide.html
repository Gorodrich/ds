<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ガイドへ移動しました | 3DS半分こするくらい仲良しクラフト</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.ds2.uk/docs/territory/">
<script>
  /* 個人開発領マップ画像編集ガイドは /docs/territory/ に章ごとのページとして移動した。
     旧ページの章アンカー(#s0〜#s4)で来た場合は、対応する章のページへ移動する */
  (function () {
    var chapters = { s0: 'requirements', s1: 'download', s2: 'gimp', s3: 'submit', s4: 'checklist' };
    var slug = chapters[location.hash.slice(1)];
    location.replace('/docs/territory/' + (slug ? slug + '/' : ''));
  })();
</script>
<meta http-equiv="refresh" content="0; url=/docs/territory/">
</head>
<body>
<p>個人開発領マップ画像編集ガイドは<a href="/docs/territory/">ガイドの「個人開発領の申請」</a>に移動しました。</p>
</body>
</html>
