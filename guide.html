<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ガイドへ移動しました | 3DS半分こするくらい仲良しクラフト</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.ds2.uk/docs/life/">
<script>
  /* 新規参加者ガイドは /docs/life/ に章ごとのページとして移動した。
     旧ページの章アンカー(#s1〜#s11)で来た場合は、対応する章のページへ移動する */
  (function () {
    var chapters = {
      s1: 'premise', s2: 'summary', s3: 'daily', s4: 'nations', s5: 'personal-dev', s6: 'prohibited',
      s7: 'violations', s8: 'discord', s9: 'governance', s10: 'amendments', s11: 'help'
    };
    var slug = chapters[location.hash.slice(1)];
    location.replace('/docs/life/' + (slug ? slug + '/' : ''));
  })();
</script>
<meta http-equiv="refresh" content="0; url=/docs/life/">
</head>
<body>
<p>新規参加者ガイドは<a href="/docs/life/">ガイドの「生活ガイド」</a>に移動しました。</p>
</body>
</html>
