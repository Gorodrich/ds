<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="manifest" href="manifest.json" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSクラフト ルールポータル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/dads/tokens.css" />
  <link rel="stylesheet" href="assets/dads/base.css" />
  <link rel="stylesheet" href="assets/dads/components.css" />
  <link rel="stylesheet" href="style_index.css" />
  <meta http-equiv="Cache-Control" content="no-store">
  <meta property="og:site_name" content="DSクラフト ルールポータル" />
  <meta property="og:url" content="https://www.ds2.uk/rule/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="トップ" />
  <meta property="og:description" content="3DS半分こするくらい仲良しクラフトのルールポータルサイトです。現在施行されているルール、ルール施行令、一部国内法を掲載しています。" />
  <meta property="og:image" content="https://www.ds2.uk/ds_logo_3.png" />
  <meta property="og:locale" content="ja_JP" />
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">DSクラフト ルールポータル</a>
      <nav class="top-nav" aria-label="サイトナビゲーション">
        <a class="dads-link" href="https://www.ds2.uk/">DSトップ</a>
      </nav>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div class="hero-section">
      <h1>3DS半分こするくらい仲良しクラフト<br>ルールポータルへようこそ！</h1>
      <p>現在施行されているルール、ルール施行令、一部国内法を掲載しています。</p>
    </div>

    <div class="rules-section">
      <div class="rules-section-header">
        <div class="rules-section-title">
          <h2>掲載中のルール一覧</h2>
        </div>
        <div class="rules-sort">
          <div class="rules-sort-inner">
            <label for="rules-sort-select">並び替え</label>
            <span class="dads-select">
              <span class="dads-select__control">
                <select class="dads-select__select" id="rules-sort-select" data-size="md">
                  <option value="default">デフォルト</option>
                  <option value="id">ルール番号順</option>
                  <option value="category">種類順</option>
                </select>
                <svg class="dads-select__chevron" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 17L3 8L4 7L12 15L20 7L21 8L12 17Z" fill="currentcolor"/>
                </svg>
              </span>
            </span>
          </div>
        </div>
      </div>
      <ul class="rules-list" id="rules-list">
        <!-- JavaScriptで動的に生成 -->
      </ul>
      <p class="rules-count">（表示件数/全件数）</p>
    </div>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-left">
      <p>©2026 3DS半分こするくらい仲良しクラフト中央委員会</p>
    </div>
    <div class="footer-right">
    </div>
  </footer>

<script>
document.addEventListener('DOMContentLoaded', function() {
  // ルール一覧はビルド時に_rules配下の各ページのfront matterから生成する
  // (rules.jsonへの実行時fetchは行わない。一覧の並び順はfront matterのorderに従う)
  let rulesOriginal = [
    {% assign sorted_rules = site.rules | sort: "order" -%}
    {%- for rule in sorted_rules -%}
    {
      id: {{ rule.url | split: '/' | last | jsonify }},
      rule_name: {{ rule.rule_name | jsonify }},
      rule_number: {{ rule.rule_number | jsonify }},
      enforcement_date: {{ rule.enforcement_date | jsonify }},
      category: {{ rule.category | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor -%}
  ];
  let rulesCurrent = rulesOriginal.slice();
  const categoryOrder = { "ルール": 0, "ルール施行令": 1, "国内法": 2 };

  function renderRules(rules) {
    const rulesList = document.getElementById('rules-list');
    const rulesCount = document.querySelector('.rules-count');
    rulesList.innerHTML = '';
    if (!rules || rules.length === 0) {
      rulesList.innerHTML = '<li><p>現在掲載中のルールはありません。</p></li>';
      rulesCount.textContent = '（表示0件/全0件）';
      return;
    }
    rules.forEach(rule => {
      const li = document.createElement('li');
      const numberText = rule.rule_number ? `<span class="rule-item__number">（${rule.rule_number}）</span>` : '';
      li.innerHTML = `
        <a class="rule-item" href="${rule.id}">
          <div class="rule-item__row1"><svg class="rule-item__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 2h9l5 5v15H6V2Z" stroke="currentColor" stroke-width="1.6"/><path d="M15 2v5h5" stroke="currentColor" stroke-width="1.6"/></svg><span class="rule-item__title">${rule.rule_name}</span>${numberText}<span class="dads-chip-label rule-item__category" data-style="outlined" data-color="gray">${rule.category}</span></div>
          <div class="rule-meta">
            <span class="rule-date">${rule.enforcement_date} 施行</span>
          </div>
        </a>
      `;
      rulesList.appendChild(li);
    });
    rulesCount.textContent = `（表示${rules.length}件/全${rulesOriginal.length}件）`;
  }

  renderRules(rulesCurrent);

  document.getElementById('rules-sort-select').addEventListener('change', function() {
    let sorted;
    if (this.value === 'default') {
      sorted = rulesOriginal.slice();
    } else if (this.value === 'id') {
      sorted = rulesCurrent.slice().sort((a, b) => {
        // アルファベット→数字順
        if (a.id < b.id) return -1;
        if (a.id > b.id) return 1;
        return 0;
      });
    } else if (this.value === 'category') {
      sorted = rulesCurrent.slice().sort((a, b) => {
        const ca = categoryOrder[a.category] ?? 99;
        const cb = categoryOrder[b.category] ?? 99;
        if (ca !== cb) return ca - cb;
        // 同じカテゴリならid順
        if (a.id < b.id) return -1;
        if (a.id > b.id) return 1;
        return 0;
      });
    } else {
      sorted = rulesOriginal.slice();
    }
    rulesCurrent = sorted;
    renderRules(rulesCurrent);
  });

});
</script>

</body>
</html>
