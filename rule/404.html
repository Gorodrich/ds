<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - ページが見つかりません | DSクラフト ルールポータル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <style>
    /* 基本リセット */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* フォントとカラー */
body {
  font-family: "Noto Sans JP", sans-serif;
  font-optical-sizing: auto;
  font-weight: 400;
  font-style: normal;
  line-height: 1.7;
  background: #ffffff;
  color: #222;
}

/* ヘッダー */
.site-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #f0f2f5;
  padding: 12px 20px;
  border-bottom: 1px solid #ccc;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  z-index: 1000;
  height: 48px;
  box-sizing: border-box;
}

.site-header .logo {
  font-size: 20px;
  font-weight: bold;
  color: #005bac;
}

.site-header .top-nav a {
  margin-left: 20px;
  text-decoration: none;
  color: #005bac;
}

.site-header .top-nav a:hover {
  text-decoration: underline;
}

/* メインコンテンツ */
.main-content {
  width: 100vw;
  margin: 48px auto 40px auto;
  padding: 40px 20px;
  background: #fff;
  min-height: calc(100vh - 88px);
  box-sizing: border-box;
  height: calc(100vh - 48px - 40px);
  overflow-y: auto;
}

/* 404エラーページ用スタイル */
.error-section {
  text-align: center;
  margin: 60px auto;
  padding: 60px 20px;
  max-width: 800px;
}

.error-code {
  font-size: 120px;
  font-weight: bold;
  color: #005bac;
  margin-bottom: 20px;
  line-height: 1;
}

.error-section h1 {
  font-size: 28px;
  color: #222;
  margin-bottom: 20px;
  line-height: 1.4;
}

.error-section p {
  font-size: 18px;
  color: #444;
  margin-bottom: 40px;
  line-height: 1.6;
}

.back-link {
  display: inline-block;
  background: #005bac;
  color: #fff;
  padding: 12px 30px;
  text-decoration: none;
  border-radius: 6px;
  font-size: 16px;
  font-weight: bold;
  transition: background-color 0.3s;
}

.back-link:hover {
  background: #004494;
}

/* フッター */
.site-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  font-size: 14px;
  background: #f8f8f8;
  border-top: 1px solid #ccc;
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100vw;
  z-index: 1000;
  height: 40px;
  box-sizing: border-box;
  line-height: 40px;
}

.site-footer .footer-left,
.site-footer .footer-right {
  display: flex;
  align-items: center;
  height: 100%;
  line-height: 40px;
}

.site-footer .footer-left {
  justify-content: flex-start;
}

.site-footer .footer-right {
  justify-content: flex-end;
}

.site-footer p {
  margin: 0;
}

.site-footer a {
  color: #005bac;
  text-decoration: none;
  margin-left: 10px;
  display: flex;
  align-items: center;
  line-height: 40px;
}

.site-footer a:hover {
  text-decoration: underline;
}

/* レスポンシブ対応 */
@media (max-width: 768px) {
  .site-header {
    padding: 0 12px;
  }
  
  .site-header .logo {
    font-size: 16px;
  }
  
  .site-header .top-nav a {
    margin-left: 12px;
    font-size: 14px;
  }
  
  .main-content {
    padding: 20px 12px;
    height: calc(100vh - 48px - 36px);
    min-height: unset;
    width: 100vw;
  }
  
  .error-section {
    margin: 40px auto;
    padding: 40px 20px;
  }
  
  .error-code {
    font-size: 80px;
  }
  
  .error-section h1 {
    font-size: 24px;
  }
  
  .error-section p {
    font-size: 16px;
    margin-bottom: 30px;
  }
  
  .back-link {
    padding: 10px 25px;
    font-size: 15px;
  }
}

/* 印刷用スタイル */
@media print {
  .site-header,
  .site-footer {
    position: static !important;
  }
  
  .main-content {
    margin: 0 !important;
    box-shadow: none !important;
  }
}

  </style>
  <meta http-equiv="Cache-Control" content="no-store">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="logo">DSクラフト ルールポータル</div>
    <nav class="top-nav">
      <a href="index.html">ホーム</a>
      <a href="https://www.ds2.uk/">DSトップ</a>
    </nav>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div class="error-section">
      <div class="error-code">404</div>
      <h1>指定したルールは掲載されていません</h1>
      <p>
        お探しのルールページは見つかりませんでした。<br>
        ページが移動または削除されたか、まだ公開されていない可能性があります。<br>
        下のボタンをクリックしてトップページにお戻りください。
      </p>
      <a href="index.html" class="back-link">トップページに戻る</a>
    </div>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-left">
      <p>©2025 3DS半分こするくらい仲良しクラフト中央委員会</p>
    </div>
    <div class="footer-right">
    </div>
  </footer>

</body>
</html>
