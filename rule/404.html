<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - ページが見つかりません | DSクラフト ルールポータル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/dads/tokens.css" />
  <link rel="stylesheet" href="assets/dads/base.css" />
  <link rel="stylesheet" href="assets/dads/components.css" />
  <link rel="stylesheet" href="style_index.css" />
  <style>
    .error-section {
      text-align: center;
      margin: 60px auto;
      padding: 60px 20px;
      max-width: 800px;
    }
    .error-section .error-code {
      font-size: calc(96 / 16 * 1rem);
      font-weight: bold;
      color: var(--color-key-1000);
      margin-bottom: 16px;
      line-height: 1;
    }
    .error-section .dads-heading__heading {
      font-size: calc(28 / 16 * 1rem);
      margin-bottom: 20px;
    }
    .error-section p {
      font-size: calc(18 / 16 * 1rem);
      color: var(--color-neutral-solid-gray-700);
      margin-bottom: 40px;
      line-height: 1.6;
    }
    .error-section .dads-button {
      margin: 0 auto;
    }
    @media (max-width: 768px) {
      .error-section {
        margin: 40px auto;
        padding: 40px 20px;
      }
      .error-section .error-code {
        font-size: calc(64 / 16 * 1rem);
      }
      .error-section .dads-heading__heading {
        font-size: calc(22 / 16 * 1rem);
      }
      .error-section p {
        font-size: calc(15 / 16 * 1rem);
        margin-bottom: 30px;
      }
    }
  </style>
  <meta http-equiv="Cache-Control" content="no-store">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">DSクラフト ルールポータル</a>
      <nav class="top-nav" aria-label="サイトナビゲーション">
        <a class="dads-link" href="index.html">ホーム</a>
        <a class="dads-link" href="https://www.ds2.uk/">DSトップ</a>
      </nav>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div class="error-section">
      <p class="error-code">404</p>
      <hgroup class="dads-heading" data-size="28">
        <h1 class="dads-heading__heading">指定したルールは掲載されていません</h1>
      </hgroup>
      <p>
        お探しのルールページは見つかりませんでした。<br>
        ページが移動または削除されたか、まだ公開されていない可能性があります。<br>
        下のボタンをクリックしてトップページにお戻りください。
      </p>
      <a href="index.html" class="dads-button" data-type="solid-fill" data-size="lg">トップページに戻る</a>
    </div>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-left">
      <p>©2025 3DS半分こするくらい仲良しクラフト中央委員会</p>
    </div>
    <div class="footer-right">
    </div>
  </footer>

</body>
</html>
