title: DSクラフト ルールポータル
url: "https://www.ds2.uk"

# rule/ 配下のルールページ用コレクション。各ページのfront matterで
# permalink(公開パス)を指定しているため、collectionレベルのpermalinkは設定しない。
# rules は docs より前に書くこと。ガイドの関連条文(_includes/docs-related-rules.html)は、
# 先に変換されたルールのHTMLから条を抜き出すため、この順で変換される必要がある。
collections:
  rules:
    output: true
  # docs/ 配下のガイドページ用コレクション(_docs/<タブ>/*.md、1ファイル ＝ 1章)。
  # 公開パスは各ページのfront matterのpermalinkで /docs/<タブ>/<スラッグ>/ の形に指定する。
  docs:
    output: true

# ガイドページの「Markdownを表示」で開く、元のMarkdownファイルの置き場所(GitHubの生ファイル)
docs_source_base: https://raw.githubusercontent.com/gorodrich/ds/main/

# ベンダー同梱の別リポジトリ(design-system-example-components-html)は
# ファイル数が非常に多くビルド対象に含めると重いため除外する。
# skills-lock.jsonはClaude Code用のツール設定でサイトの公開物ではないため除外する。
# README.mdはリポジトリの説明であり、GitHub Pagesでページ化されないよう除外する。
exclude:
  - rule/design-system-example-components-html
  - skills-lock.json
  - README.md

# ルール条文をMarkdown(_rules/*.md)で書くための変換設定。
# hard_wrap: 条文中の改行(項・号の区切り)をそのまま<br>にする。
# auto_ids: 見出しidは目次スクリプトが見出しの文言から付けるため、kramdownの自動付与を止める
#           (自動付与だと「第8条（窃盗の禁止）」の括弧が除かれ、既存の条文間リンクが切れる)。
kramdown:
  hard_wrap: true
  auto_ids: false
