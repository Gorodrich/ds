<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3DS半分こするくらい仲良しクラフト</title>
  <link rel="icon" href="/favicon.ico" id="favicon">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      font-family: "Noto Sans JP", sans-serif;
      font-optical-sizing: auto;
      font-weight: 700;
      font-style: normal;
      line-height: 1.5;
      /* 背景画像を固定表示（適宜パスを変更） */
      background: url("background.jpg") no-repeat center center fixed;
      background-size: cover;
      background-color: #ccc;
    }
    .header-shadow {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      margin: 0;
      width: 25%;
      filter: drop-shadow(0px 0px 10px rgba(0, 0, 0, 0.5));
    }
    header {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 100%;
      background-color: #fff;
      /* 左に傾斜した白い帯の形状を作成 */
      clip-path: polygon(0 0, 70% 0, 100% 100%, 0 100%);
      z-index: 1;
      padding: 20px 10px;
      box-sizing: border-box;
      flex-flow: column;
    }
    .header-title {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 60vh;
      right: 30%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-flow: column;
    }
    .logo {
      text-align: center;
      margin: 10px;
    }
    .logo img {
      width: 10vw;
      height: 10vw;
    }
    .site-name {
      width: 100%;
      font-size: 1.5vw;
      color: #333;
      text-align: center;
    }
    .menu {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      margin-top: 40vh;
      vertical-align: middle;
    }
    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    nav li {
      margin: 0.5em 0;
      font-size: 1.5vw;
    }
    nav a {
      display: block;
      text-decoration: none;
      color: #333;
      padding: 0.5em;
      padding-left: 1.5em;
      position: relative;
      background: transparent;  /* 初期状態は背景透明（下地の白を表示） */
    }
    /* ホバー時に背景を左から右へグレーに変化 */
    nav a::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 100%;
      background-color: #e0e0e0;
      z-index: -1;
      transition: width 0.3s ease;
    }
    nav a:hover::before, nav a:focus::before {
      width: 100%;
    }
    /* クリック時により暗いグレーの背景 */
    nav a:active {
      background-color: #a0a0a0;
    }
    main {
      position: fixed;
      margin-left: 40vw;
      margin-right: 10vw;
      margin-top: 10vh;
      height: 100%;
      width: 50%;
      display: flex;
      flex-flow: column;
    }
    .promo-text {
      color: #fff;
      font-family: "Audiowide", sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 6vw;
      text-align: right;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .under-promo-text {
      position: relative;
      text-align: right;
      color: #fff;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
      font-size: 2vw;
    }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 75vw;
      padding: 0.2em 0.5em;
      font-size: 0.8em;
      font-weight: 400;
      color: #333;
      background-color: transparent;
      z-index: 2;
      word-break: break-all;
    }
    /* レスポンシブ対応（画面が狭い場合） */
    @media screen and (orientation: portrait) {
      .header-shadow {
        width: 25%;
      }
      header {
        width: 100%;
        padding: 10px;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      }

    .header-title {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 60vh;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-flow: column;
    }
    .logo img {
      width: 16vw;
      height: 16vw;
    }
    .site-name {
      font-size: 2vw;
      }
      nav a {
        padding: 0.5em;
        font-size: 2.5em;
      }
      main {
      margin-left: 30vw;
      margin-right: 10vw;
      margin-top: 20vh;
      width:60%;
      display: flex;
      flex-flow: column;
    }
    .promo-text {
      color: #fff;
      font-family: "Audiowide", sans-serif;
      font-weight: 400;
      font-style: normal;
      font-size: 7vw;
      text-align: right;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .under-promo-text {
      position: relative;
      text-align: right;
      color: #fff;
      text-shadow: 0 0 10px rgba(0,0,0,0.5);
      font-size: 2.5vw;
    }
    }
  </style>
  <meta property="og:site_name" content="3DS半分こするくらい仲良しクラフト" />
  <meta property="og:url" content="/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="トップ" />
  <meta property="og:description" content="3DS半分こするくらい仲良しクラフトの公式ホームページです。ルールやWiki、マップ等のリンクはこちらから。" />
  <meta property="og:image" content="/ds_logo_3.png" />
  <meta property="og:locale" content="ja_JP" />
</head>
<body>
<div class="header-shadow">
  <header>
    <div class="header-title">
      <div class="logo"><img src="ds_logo_3.png" alt="DSロゴ"></div>
      <div class="site-name">3DS半分こするくらい<br/>仲良しクラフト</div>
    </div>
    <div class="menu">
    <nav>
      <ul>
        <li><a href="#">ホーム</a></li>
        <li><a href="/rule">ルール</a></li>
        <li><a href="http://wiki.ds2.uk/">Wiki</a></li>
        <li><a href="https://server.ds2.uk/">サーバーポータル</a></li>
        <li><a href="https://map.ds2.uk/">マップ</a></li>
      </ul>
    </nav>
      </div>
  </header>
</div>
  <main>
    <h1 class="promo-text">Let's <span style="color:rgb(255, 55, 0);">CRACK</span><br/>3DS together!</h1>
    <p class="under-promo-text">IPアドレス: 専用Discordサーバーで公開<br/>バージョン: 1.20.6(1.9.x-1.21.xでも参加できます)</p>
  </main>
  <footer>© 2025 3DS半分こするくらい仲良しクラフト中央委員会</footer>

</html>
