<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSクラフト ルールポータル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style_index.css" />
  <meta http-equiv="Cache-Control" content="no-store">
</head>
<body>

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="logo">DSクラフト ルールポータル</div>
    <nav class="top-nav">
      <a href="index.html">ホーム</a>
      <a href="https://www.ds2.uk/">DSトップ</a>
    </nav>
  </header>

  <!-- メインコンテンツ -->
  <main class="main-content">
    <div class="hero-section">
      <h1>3DS半分こするくらい仲良しクラフト<br>ルールポータルへようこそ！</h1>
      <p>現在施行されているルール、ルール施行令、一部国内法を掲載しています。</p>
    </div>

    <div class="rules-section">
      <div class="rules-section-header">
        <div class="rules-section-title">
          <h2>掲載中のルール一覧</h2>
        </div>
        <div class="rules-sort">
          <div class="rules-sort-inner">
            <label for="rules-sort-select">並び替え</label>
            <select id="rules-sort-select">
              <option value="default">デフォルト</option>
              <option value="id">ルール番号順</option>
              <option value="category">種類順</option>
            </select>
          </div>
        </div>
      </div>
      <div class="rules-list" id="rules-list">
        <!-- JavaScriptで動的に生成 -->
      </div>
      <p class="rules-count">（表示件数/全件数）</p>
    </div>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-left">
      <p>©2025 3DS半分こするくらい仲良しクラフト中央委員会</p>
    </div>
    <div class="footer-right">
      <a href="#" id="print-btn">印刷</a>
    </div>
  </footer>

<script>
document.addEventListener('DOMContentLoaded', function() {
  let rulesOriginal = [];
  let rulesCurrent = [];
  const categoryOrder = { "ルール": 0, "ルール施行令": 1, "国内法": 2 };

  function renderRules(rules) {
    const rulesList = document.getElementById('rules-list');
    const rulesCount = document.querySelector('.rules-count');
    rulesList.innerHTML = '';
    if (!rules || rules.length === 0) {
      rulesList.innerHTML = '<p>現在掲載中のルールはありません。</p>';
      rulesCount.textContent = '（表示0件/全0件）';
      return;
    }
    rules.forEach(rule => {
      const ruleItem = document.createElement('div');
      ruleItem.className = 'rule-item';
      ruleItem.innerHTML = `
        <div class="rule-icon">📄</div>
        <div class="rule-content">
          <h3><a href="${rule.id}.html">${rule.rule_name}</a></h3>
          <div class="rule-meta">
            <span class="badge">${rule.category}</span>
            <span class="rule-date">${rule.enforcement_date}</span>
            <span class="rule-number">${rule.rule_number}</span>
          </div>
        </div>
      `;
      rulesList.appendChild(ruleItem);
    });
    rulesCount.textContent = `（表示${rules.length}件/全${rulesOriginal.length}件）`;
  }

  fetch('https://gorodrich.github.io/ds/rules.json')
    .then(res => {
      if (!res.ok) throw new Error('rules.jsonの取得に失敗しました');
      return res.json();
    })
    .then(rules => {
      rulesOriginal = rules.slice();
      rulesCurrent = rules.slice();
      renderRules(rulesCurrent);
    })
    .catch(err => {
      const rulesList = document.getElementById('rules-list');
      rulesList.innerHTML = `<p style="color:red;">ルール一覧の取得に失敗しました: ${err.message}</p>`;
      console.error(err);
    });

  document.getElementById('rules-sort-select').addEventListener('change', function() {
    let sorted;
    if (this.value === 'default') {
      sorted = rulesOriginal.slice();
    } else if (this.value === 'id') {
      sorted = rulesCurrent.slice().sort((a, b) => {
        // アルファベット→数字順
        if (a.id < b.id) return -1;
        if (a.id > b.id) return 1;
        return 0;
      });
    } else if (this.value === 'category') {
      sorted = rulesCurrent.slice().sort((a, b) => {
        const ca = categoryOrder[a.category] ?? 99;
        const cb = categoryOrder[b.category] ?? 99;
        if (ca !== cb) return ca - cb;
        // 同じカテゴリならid順
        if (a.id < b.id) return -1;
        if (a.id > b.id) return 1;
        return 0;
      });
    } else {
      sorted = rulesOriginal.slice();
    }
    rulesCurrent = sorted;
    renderRules(rulesCurrent);
  });

  // 印刷機能: ヘッダー・メイン・フッターのみ印刷、見切れ防止
  document.getElementById('print-btn').addEventListener('click', function(e) {
    e.preventDefault();
    const header = document.querySelector('.site-header');
    const main = document.querySelector('.main-content');
    const footer = document.querySelector('.site-footer');
    if (!header || !main || !footer) return;
    const printWindow = window.open('', '', 'width=900,height=700');
    // スクロール用にmain-contentの高さ・overflowを解除
    printWindow.document.write(`
      <html>
        <head>
          <title>印刷</title>
          <link rel="stylesheet" href="style_index.css">
          <style>
            body, html {
              background: #fff !important;
              margin: 0 !important;
              padding: 0 !important;
              width: 100vw !important;
              height: auto !important;
              overflow: visible !important;
            }
            .site-header, .main-content, .site-footer {
              position: static !important;
              width: 100vw !important;
              margin: 0 !important;
              box-shadow: none !important;
              background: #fff !important;
              z-index: 1 !important;
            }
            .main-content {
              height: auto !important;
              min-height: unset !important;
              overflow: visible !important;
              max-width: 100vw !important;
              padding-bottom: 0 !important;
            }
            @media print {
              .site-header, .main-content, .site-footer {
                position: static !important;
                box-shadow: none !important;
              }
              .main-content {
                height: auto !important;
                min-height: unset !important;
                overflow: visible !important;
                max-width: 100vw !important;
              }
            }
          </style>
        </head>
        <body>
          <div class="site-header">
            ${header.innerHTML}
          </div>
          <main class="main-content">
            ${main.innerHTML}
          </main>
          <footer class="site-footer">
            ${footer.innerHTML}
          </footer>
        </body>
      </html>
    `);
    printWindow.document.close();
    printWindow.focus();
    printWindow.print();
    printWindow.close();
  });
});
</script>

</body>
</html>
